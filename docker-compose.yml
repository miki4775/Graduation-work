version: '3'
services:
  web:
    build: .
    volumes:
      - ".:/myapp"
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=development
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b '0.0.0.0'"  # サーバーを起動
  db:
    image: postgres:15
    volumes:
      - "db_data:/var/lib/postgresql/data"
    environment:
      POSTGRES_PASSWORD: password  # 任意のパスワード
volumes:
  db_data:
